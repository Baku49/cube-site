<main class="cl-main">
<h1 class="page">メタキューブ カードリスト</h1>
<div class="updated" id="cl-meta">読み込み中…</div>

<div class="cl-controls">
  <input id="cl-search" class="g-search" type="search" placeholder="カード名で検索(日本語名・英語名)" autocomplete="off">
  <div class="cl-btnrow">
    <div class="cl-toggle">
      <button id="cl-view-img" class="cl-tbtn active">画像表示</button>
      <button id="cl-view-name" class="cl-tbtn">カード名表示</button>
    </div>
    <button id="cl-history" class="cl-tbtn">更新履歴</button>
    <span id="cl-count" class="cl-count"></span>
  </div>
</div>

<div id="cl-sections"></div>
<div id="cl-empty" class="wip hidden"><p>該当するカードがありません</p></div>
</main>

<div id="cl-modal" class="cl-modal hidden" role="dialog" aria-modal="true">
  <div class="cl-modal-back"></div>
  <div class="cl-modal-box">
    <button class="cl-close" aria-label="閉じる">×</button>
    <div id="cl-modal-content"></div>
  </div>
</div>

<div id="cl-hmodal" class="cl-modal hidden" role="dialog" aria-modal="true">
  <div class="cl-modal-back"></div>
  <div class="cl-modal-box">
    <button class="cl-close" aria-label="閉じる">×</button>
    <h2 class="cl-h2">更新履歴</h2>
    <div id="cl-hmodal-content"></div>
  </div>
</div>

<script>
(function(){
const CATS = [
  ["White","白"],["Blue","青"],["Black","黒"],["Red","赤"],["Green","緑"],
  ["Multicolored","多色"],["Colorless","無色"]
];
const TYPE_PRI = ["Creature","Planeswalker","Instant","Sorcery","Artifact","Enchantment","Battle","Land","Conspiracy"];
function typePri(c){
  const tl = [c.type_line||"", ...(c.faces||[]).map(f=>f.type_line||"")].join(" // ");
  for(let i=0;i<TYPE_PRI.length;i++){ if(tl.includes(TYPE_PRI[i])) return i; }
  return TYPE_PRI.length;
}
const CI_ORDER = ["WU","UB","BR","RG","WG","WB","UR","BG","WR","UG",
  "WUG","WUB","UBR","BRG","WRG","WBG","WUR","UBG","WBR","URG",
  "WUBR","WUBG","WURG","WBRG","UBRG","WUBRG"];
function ciIdx(c){ const i = CI_ORDER.indexOf(c.ci||""); return i<0 ? CI_ORDER.length : i; }
const CAT_IDX = {White:0,Blue:1,Black:2,Red:3,Green:4,Multicolored:5,Colorless:6};
function cardCmp(a,b){
  const ca = CAT_IDX[a.cat] != null ? CAT_IDX[a.cat] : 9;
  const cb = CAT_IDX[b.cat] != null ? CAT_IDX[b.cat] : 9;
  if(ca !== cb) return ca - cb;
  if(a.cat === "Multicolored"){
    const d = ciIdx(a) - ciIdx(b); if(d) return d;
  }
  return typePri(a)-typePri(b) || (a.cmc||0)-(b.cmc||0) || (a.name<b.name?-1:(a.name>b.name?1:0));
}
let CARDS = [], OVR = {}, LOG = [], view = "img", query = "";

function norm(s){
  return (s||"").toLowerCase().replace(/[ァ-ヶ]/g, ch => String.fromCharCode(ch.charCodeAt(0)-0x60));
}
function key(c){ return c.set + ":" + c.cn; }
function ov(c){ return OVR[key(c)] || {}; }
function jaName(c){ const o=ov(c); return o.name || c.printed_name || (c.faces&&c.faces.map(f=>f.printed_name||f.name).join(" // ")) || c.name; }
function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function br(s){ return esc(s).replace(/\n/g,"<br>").replace(/\{([^}]{1,4})\}/g, function(_, sym){
  const cls = {W:"mw",U:"mu",B:"mb",R:"mr",G:"mg"}[sym] || "mc";
  return '<span class="ms '+cls+'">'+sym+'</span>';
}); }
function manaHtml(cost){
  if(!cost) return "";
  return esc(cost).replace(/\{([^}]+)\}/g, function(_, sym){
    const cls = {W:"mw",U:"mu",B:"mb",R:"mr",G:"mg"}[sym] || "mc";
    return '<span class="ms '+cls+'">'+sym+'</span>';
  });
}
function cardImg(c){
  const o=ov(c);
  return o.img || c.img || (c.faces && c.faces[0] && c.faces[0].img) || "";
}
function matches(c){
  if(!query) return true;
  const hay = norm([c.name, c.printed_name, (c.faces||[]).map(f=>(f.name||"")+" "+(f.printed_name||"")).join(" "), (ov(c).name||"")].join(" "));
  return hay.includes(query);
}

function render(){
  const root = document.getElementById("cl-sections");
  root.innerHTML = "";
  let shown = 0, total = 0;
  CATS.forEach(function(cat){
    const cs = CARDS.filter(c=>c.cat===cat[0]);
    if(!cs.length) return;
    total += cs.reduce((a,c)=>a+c.count,0);
    const vis = cs.filter(matches);
    if(!vis.length) return;
    shown += vis.reduce((a,c)=>a+c.count,0);
    const sec = document.createElement("section");
    sec.innerHTML = '<h2 class="g-section-title">'+cat[1]+' <span class="cl-seccount">'+vis.reduce((a,c)=>a+c.count,0)+'枚</span></h2>';
    const wrap = document.createElement("div");
    wrap.className = view==="img" ? "cl-grid" : "cl-names";
    vis.forEach(function(c){
      const el = document.createElement(view==="img" ? "div" : "button");
      if(view==="img"){
        el.className = "cl-card";
        el.innerHTML = '<img loading="lazy" src="'+cardImg(c)+'" alt="'+esc(jaName(c))+'">' +
          (c.count>1 ? '<span class="cl-badge">×'+c.count+'</span>' : "") +
          (ov(c).note ? '<span class="cl-errata">E</span>' : "");
      } else {
        el.className = "cl-nameitem";
        el.innerHTML = esc(jaName(c)) + (c.count>1 ? ' <span class="cl-nbadge">×'+c.count+'</span>' : "") +
          (ov(c).note ? ' <span class="cl-errata-inline">エラッタ</span>' : "");
      }
      el.addEventListener("click", ()=>openModal(c));
      wrap.appendChild(el);
    });
    sec.appendChild(wrap);
    root.appendChild(sec);
  });
  document.getElementById("cl-empty").classList.toggle("hidden", shown>0);
  document.getElementById("cl-count").textContent = query ? (shown+" / "+total+"枚") : (total+"枚("+CARDS.length+"種)");
}

function faceHtml(f, c){
  const o = ov(c);
  let h = '<div class="cl-face">';
  h += '<div class="cl-cardname">'+esc(f.printed_name||f.name)+'</div>';
  if(f.printed_name && f.name && f.printed_name!==f.name) h += '<div class="cl-en">'+esc(f.name)+'</div>';
  if(f.mana_cost) h += '<div class="cl-line">'+manaHtml(f.mana_cost)+'</div>';
  h += '<div class="cl-type">'+esc(f.printed_type_line||f.type_line||"")+'</div>';
  const text = f.printed_text!=null ? f.printed_text : f.oracle_text;
  if(text) h += '<div class="cl-text">'+br(text)+'</div>';
  if(f.flavor_text) h += '<div class="cl-flavor">'+br(f.flavor_text)+'</div>';
  const pt = f.power!=null ? f.power+"/"+f.toughness : (f.loyalty!=null ? "忠誠度 "+f.loyalty : (f.defense!=null ? "守備値 "+f.defense : ""));
  if(pt) h += '<div class="cl-pt">'+esc(pt)+'</div>';
  h += '</div>';
  return h;
}

function openModal(c){
  const o = ov(c);
  const box = document.getElementById("cl-modal-content");
  let imgs = [];
  if(o.img){ imgs = [o.img]; }
  else if(c.faces && c.faces.some(f=>f.img)){ imgs = c.faces.map(f=>f.img).filter(Boolean); }
  else if(cardImg(c)) imgs = [cardImg(c)];
  let h = '<div class="cl-detail">';
  h += '<div class="cl-detail-imgs">'+imgs.map(u=>'<img src="'+u+'">').join("")+'</div>';
  h += '<div class="cl-detail-info">';
  if(o.note) h += '<div class="cl-ovnote">⚠ '+esc(o.note)+'</div>';
  if(o.name || o.type || o.text || o.flavor){
    h += '<div class="cl-face">';
    h += '<div class="cl-cardname">'+esc(o.name||jaName(c))+'</div>';
    h += '<div class="cl-en">'+esc(c.name)+'</div>';
    if(c.mana_cost) h += '<div class="cl-line">'+manaHtml(c.mana_cost)+'</div>';
    h += '<div class="cl-type">'+esc(o.type||c.printed_type_line||c.type_line||"")+'</div>';
    if(o.text) h += '<div class="cl-text">'+br(o.text)+'</div>';
    if(o.flavor) h += '<div class="cl-flavor">'+br(o.flavor)+'</div>';
    h += '</div>';
    h += '<details class="cl-orig"><summary>元のテキストを表示</summary>';
  }
  if(c.faces && c.faces.length){
    h += c.faces.map(f=>faceHtml(f,c)).join('<hr class="cl-hr">');
  } else {
    h += faceHtml(c, c);
  }
  if(o.name || o.type || o.text || o.flavor) h += '</details>';
  h += '<div class="cl-metainfo">';
  h += esc(c.set_name||c.set.toUpperCase())+' ('+esc(c.set.toUpperCase())+') #'+esc(c.cn);
  if(c.rarity) h += ' ｜ '+esc(c.rarity);
  if(c.artist) h += ' ｜ Illus. '+esc(c.artist);
  if(c.count>1) h += ' ｜ キューブに'+c.count+'枚';
  if(c.lang!=='ja') h += '<br><span class="cl-noja">※日本語版データなし(英語版を表示)</span>';
  h += '</div>';
  if(c.scryfall_uri) h += '<div class="cl-metainfo"><a href="'+esc(c.scryfall_uri)+'" target="_blank" rel="noopener">Scryfallで見る ↗</a></div>';
  h += '</div></div>';
  box.innerHTML = h;
  document.getElementById("cl-modal").classList.remove("hidden");
  document.body.style.overflow = "hidden";
}

function openHistory(){
  const box = document.getElementById("cl-hmodal-content");
  if(!LOG.length){ box.innerHTML = "<p>履歴はまだありません。</p>"; }
  else{
    box.innerHTML = LOG.map(function(e){
      let h = '<div class="cl-logentry"><div class="cl-logdate">'+esc(e.date)+'</div>';
      if(e.note) h += '<div class="cl-lognote">'+esc(e.note)+'</div>';
      if(e.added && e.added.length) h += '<div class="cl-logadd">＋ 追加('+e.added.length+'): '+e.added.map(esc).join("、")+'</div>';
      if(e.removed && e.removed.length) h += '<div class="cl-logrem">－ 削除('+e.removed.length+'): '+e.removed.map(esc).join("、")+'</div>';
      return h+'</div>';
    }).join("");
  }
  document.getElementById("cl-hmodal").classList.remove("hidden");
  document.body.style.overflow = "hidden";
}

function closeModals(){
  document.querySelectorAll(".cl-modal").forEach(m=>m.classList.add("hidden"));
  document.body.style.overflow = "";
}

document.addEventListener("DOMContentLoaded", function(){
  document.querySelectorAll(".cl-modal-back,.cl-close").forEach(el=>el.addEventListener("click", closeModals));
  document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModals(); });
  document.getElementById("cl-search").addEventListener("input", function(){ query = norm(this.value.trim()); render(); });
  document.getElementById("cl-view-img").addEventListener("click", function(){ view="img"; setToggle(this); render(); });
  document.getElementById("cl-view-name").addEventListener("click", function(){ view="name"; setToggle(this); render(); });
  document.getElementById("cl-history").addEventListener("click", openHistory);
  function setToggle(btn){
    document.getElementById("cl-view-img").classList.remove("active");
    document.getElementById("cl-view-name").classList.remove("active");
    btn.classList.add("active");
  }
  const v = "?v=" + Date.now();
  Promise.all([
    fetch("data/cards.json"+v).then(r=>r.json()),
    fetch("data/overrides.json"+v).then(r=>r.ok?r.json():{}).catch(()=>({})),
    fetch("data/changelog.json"+v).then(r=>r.ok?r.json():[]).catch(()=>[])
  ]).then(function(res){
    CARDS = res[0].cards;
    OVR = res[1]; LOG = res[2];
    CARDS.sort(cardCmp);
    document.getElementById("cl-meta").textContent = "最終更新日: "+(res[0].generated||"-")+" ｜ カードリストは Cube Cobra を元に Scryfall のデータで表示しています";
    render();
  }).catch(function(e){
    document.getElementById("cl-meta").textContent = "データの読み込みに失敗しました: "+e;
  });
});
})();
</script>
