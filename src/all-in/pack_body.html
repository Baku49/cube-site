<main class="cl-main">
<h1 class="page">オールイン パックシミュレーター</h1>
<div class="updated">カードリスト(全1000枚)からランダムに16枚を取り出したパックを表示します。カードをクリックで詳細表示。</div>

<div class="cl-btnrow" style="margin:0 0 1.2rem">
  <button id="pk-reroll" class="btn" style="cursor:pointer;font-family:inherit;background:none">↻ 再開封</button>
</div>

<h2 class="g-section-title">パック <span class="cl-seccount">16枚</span></h2>
<div id="pk-pack" class="cl-grid"></div>
</main>

<div id="cl-modal" class="cl-modal hidden" role="dialog" aria-modal="true">
  <div class="cl-modal-back"></div>
  <div class="cl-modal-box">
    <button class="cl-close" aria-label="閉じる">×</button>
    <div id="cl-modal-content"></div>
  </div>
</div>

<script>
(function(){
let DATA = null;

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function brz(s){ return esc(s).replace(/\n/g,"<br>"); }
function card(name){ return DATA.cards[name] || {name:name, ruby:"", types:[], text:""}; }
function disp(name){ const c = card(name); return c.name || name; }
function imgSrc(c){ return c.cid && c.img ? "../assets/ygo/"+c.cid+".jpg" : ""; }
function blankHtml(name, cls){
  return '<div class="cl-blank '+(cls||"")+'"><span>'+esc(disp(name))+'</span><span class="cl-blank-sub">未発売</span></div>';
}
function lvLine(c){
  const parts = [];
  if(c.attr) parts.push(c.attr+"属性");
  if(c.lvt && c.lv != null) parts.push(c.lvt+" "+c.lv);
  if(c.sub) parts.push(c.sub+(c.kind==="spell"?"魔法":"罠"));
  else if(c.kind==="spell") parts.push("通常魔法");
  else if(c.kind==="trap") parts.push("通常罠");
  return parts.join("　");
}
function cardBlock(name, idx, total){
  const c = card(name);
  const alt = DATA.alt[name];
  let head = "";
  if(total > 1) head = '<div class="cl-set-no">'+(idx+1)+' / '+total+'枚目</div>';
  let info = '<div class="cl-cardname">'+esc(disp(name))+'</div>';
  if(c.ruby && c.ruby !== disp(name)) info += '<div class="cl-en">'+esc(c.ruby)+'</div>';
  info += '<div class="cl-type">'+esc(lvLine(c)) +
    (c.types && c.types.length ? '　【'+esc(c.types.join("／"))+'】' : "") + '</div>';
  if(c.atk != null || c.def != null){
    info += '<div class="cl-line cl-pt" style="text-align:left">攻撃力 '+esc(String(c.atk!=null?c.atk:"-"))+'　／　守備力 '+esc(String(c.def!=null?c.def:"-"))+'</div>';
  }
  if(c.pens) info += '<div class="cl-line"><strong>Pスケール：'+esc(String(c.pens))+'</strong></div>';
  if(c.pen) info += '<div class="cl-text" style="border-left:2px solid var(--u);padding-left:.6rem">'+brz(c.pen)+'</div>';
  if(alt){
    info += '<div class="cl-ovnote">このカードには<strong>代替テキスト</strong>が適用される。本来のテキストの代わりに以下のテキストを用いる。</div>';
    info += '<div class="cl-text">'+brz(alt)+'</div>';
    if(c.text) info += '<details class="cl-orig"><summary>現在の公式テキストを表示</summary><div class="cl-text">'+brz(c.text)+'</div></details>';
  } else if(c.unreleased){
    info += '<div class="cl-text" style="color:var(--muted)">未発売カード（公式データベース未収録のため、データは未登録）</div>';
  } else {
    info += '<div class="cl-text">'+brz(c.text||"(テキストなし)")+'</div>';
  }
  const img = imgSrc(c)
    ? '<div class="cl-detail-imgs"><img src="'+imgSrc(c)+'" alt="'+esc(disp(name))+'"></div>'
    : '<div class="cl-detail-imgs">'+blankHtml(name, "cl-blank-lg")+'</div>';
  return head + '<div class="cl-detail">'+img+'<div class="cl-detail-info">'+info+'</div></div>';
}
function openModal(u){
  const isWild = u.names.length > 1;
  let html = "";
  if(isWild) html += '<div class="cl-ovnote" style="background:#2a2418;border-color:var(--gold);color:var(--gold2)">'+
    '<strong>ワイルドカード</strong>：これをピックすると、以下の'+u.names.length+'枚全てがセットでカードプールに加わる。</div>';
  u.names.forEach(function(n,i){ if(i>0) html += '<hr class="cl-hr">'; html += cardBlock(n, i, u.names.length); });
  document.getElementById("cl-modal-content").innerHTML = html;
  document.getElementById("cl-modal").classList.remove("hidden");
  document.body.style.overflow = "hidden";
}
function closeModal(){
  document.getElementById("cl-modal").classList.add("hidden");
  document.body.style.overflow = "";
}

function sample(arr, n){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a.slice(0, Math.min(n, a.length));
}
function unitEl(u){
  const el = document.createElement("div");
  const isWild = u.names.length > 1;
  if(isWild){
    el.className = "cl-card cl-set";
    let imgs = "";
    u.names.forEach(function(n,i){
      const c = card(n);
      const cls = "cl-set-img cl-si"+i+" cl-sn"+u.names.length;
      imgs += imgSrc(c)
        ? '<img loading="lazy" class="'+cls+'" src="'+imgSrc(c)+'" alt="'+esc(disp(n))+'">'
        : blankHtml(n, cls);
    });
    el.innerHTML = '<div class="cl-set-stack">'+imgs+'</div><span class="cl-wtag">ワイルド</span>';
  } else {
    el.className = "cl-card";
    const c = card(u.names[0]);
    el.innerHTML = imgSrc(c)
      ? '<img loading="lazy" src="'+imgSrc(c)+'" alt="'+esc(disp(u.names[0]))+'">'
      : blankHtml(u.names[0], "");
  }
  el.addEventListener("click", function(){ openModal(u); });
  return el;
}
function reroll(){
  // 1000枚の実物カード(ワイルドは1枚扱い)に展開してから16枚引く
  const pool = [];
  DATA.units.forEach(u => { for(let i=0;i<(u.count||1);i++) pool.push(u); });
  const root = document.getElementById("pk-pack");
  root.innerHTML = "";
  sample(pool, 16).forEach(u => root.appendChild(unitEl(u)));
}

document.addEventListener("DOMContentLoaded", function(){
  document.querySelector("#cl-modal .cl-modal-back").addEventListener("click", closeModal);
  document.querySelector("#cl-modal .cl-close").addEventListener("click", closeModal);
  document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });
  document.getElementById("pk-reroll").addEventListener("click", reroll);
  fetch("data/cards.json?v="+Date.now()).then(r=>r.json()).then(function(d){
    DATA = d;
    reroll();
  }).catch(function(e){
    document.getElementById("pk-pack").innerHTML = "<p>データの読み込みに失敗しました</p>";
  });
});
})();
</script>
